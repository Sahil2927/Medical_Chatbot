# Render Blueprint — MediAssist
# Dashboard: New → Blueprint → connect repo, or apply this file from the Render dashboard.

databases:
  - name: mediassist-db
    plan: free
    databaseName: mediassist
    user: mediassist

services:
  - type: web
    name: mediassist
    runtime: python
    plan: free
    branch: main
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: NODE_VERSION
        value: "20"
      - key: HF_HOME
        value: /tmp/hf
      - key: TRANSFORMERS_CACHE
        value: /tmp/hf
      - key: ENVIRONMENT
        value: production
      - key: LAZY_RAG_INIT
        value: "true"
      - key: ENABLE_MOCK_STATUS
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: mediassist-db
          property: connectionString
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_MENTAL_HEALTH_INDEX_NAME
        value: medical-chatbot-mh
      - key: PINECONE_LAB_RESULTS_INDEX_NAME
        value: medical-chatbot-lab
      - key: CORS_ORIGINS
        sync: false
