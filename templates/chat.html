<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Medical Chatbot</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="/static/style.css"/>
</head>
<body>
	<div class="container-fluid h-100">
		<div class="row justify-content-center h-100">
			<div class="col-md-8 col-xl-6 chat">
				<div class="alert alert-warning text-center mb-2 py-2" role="alert" style="font-size: 0.85rem;">
					For education only — not medical diagnosis. Seek professional care for emergencies.
				</div>
				<div class="card">
					<div class="card-header msg_head">
						<div class="d-flex bd-highlight">
							<div class="img_cont">
								<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot" class="rounded-circle user_img">
								<span class="online_icon"></span>
							</div>
							<div class="user_info">
								<span>Medical Chatbot</span>
								<p>Ask about symptoms (informational only)</p>
							</div>
						</div>
					</div>
					<div id="messageFormeight" class="card-body msg_card_body"></div>
					<div class="card-footer">
						<form id="messageArea" class="input-group">
							<input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required maxlength="2000"/>
							<div class="input-group-append">
								<button type="submit" id="send" class="input-group-text send_btn" aria-label="Send">
									<i class="fas fa-location-arrow"></i>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script>
		function formatTime() {
			const date = new Date();
			return date.getHours() + ":" + String(date.getMinutes()).padStart(2, "0");
		}

		function appendMessage(side, text, timeStr) {
			const isUser = side === "user";
			const row = $("<div>").addClass("d-flex mb-4").addClass(isUser ? "justify-content-end" : "justify-content-start");
			const bubble = $("<div>").addClass(isUser ? "msg_cotainer_send" : "msg_cotainer").text(text);
			const timeSpan = $("<span>").addClass(isUser ? "msg_time_send" : "msg_time").text(timeStr);
			bubble.append(timeSpan);

			const avatar = $("<div>").addClass("img_cont_msg");
			const img = $("<img>").addClass("rounded-circle user_img_msg").attr("alt", isUser ? "You" : "Bot");
			img.attr("src", isUser
				? "https://i.ibb.co/d5b84Xw/Untitled-design.png"
				: "https://cdn-icons-png.flaticon.com/512/387/387569.png");

			avatar.append(img);
			if (isUser) {
				row.append(bubble).append(avatar);
			} else {
				row.append(avatar).append(bubble);
			}
			$("#messageFormeight").append(row);
			$("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
		}

		$(document).ready(function() {
			$("#messageArea").on("submit", function(event) {
				event.preventDefault();
				const rawText = $("#text").val().trim();
				if (!rawText) return;

				const strTime = formatTime();
				appendMessage("user", rawText, strTime);
				$("#text").val("");
				$("#send").prop("disabled", true);

				$.ajax({
					url: "/api/chat",
					type: "POST",
					contentType: "application/json",
					data: JSON.stringify({ msg: rawText }),
					dataType: "json",
				}).done(function(data) {
					appendMessage("bot", data.answer || "No response.", strTime);
				}).fail(function(xhr) {
					let err = "Something went wrong. Please try again.";
					if (xhr.responseJSON && xhr.responseJSON.detail) {
						err = typeof xhr.responseJSON.detail === "string"
							? xhr.responseJSON.detail
							: JSON.stringify(xhr.responseJSON.detail);
					}
					appendMessage("bot", err, strTime);
				}).always(function() {
					$("#send").prop("disabled", false);
					$("#text").focus();
				});
			});
		});
	</script>
</body>
</html>
